apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-notification-dispatcher
  labels:
    app: cloud-notification-dispatcher
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-notification-dispatcher
  template:
    metadata:
      labels:
        app: cloud-notification-dispatcher
    spec:
      containers:
        - name: notification-dispatcher
          image: cloud-notification-dispatcher:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: CLOUD_SECURITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-notification-service
spec:
  type: ClusterIP
  selector:
    app: cloud-notification-dispatcher
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8086
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
type: Opaque
stringData:
  api-key: "vibe-cloud-secret-key-2026"
