<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Login</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page-container">

        <!-- Header -->
        <header class="page-header">
            <div>
                <p class="eyebrow">FULL STACK DEVELOPMENT • TASK 3</p>

                <h1>Welcome Back</h1>

                <p class="subtitle">
                    Sign in to access your StudentHub account.
                </p>
            </div>
        </header>


        <!-- Login Section -->
        <section class="login-section">

            <div class="login-card">

                <!-- Login Icon -->
                <div class="login-icon">
                    🔐
                </div>

                <div class="login-heading">
                    <h2>Student Login</h2>

                    <p>
                        Enter your registered credentials to continue.
                    </p>
                </div>


                <!-- Login Form -->
                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                        >

                        <small
                            class="field-error"
                            id="emailError">
                        </small>

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Show password">
                                Show
                            </button>

                        </div>

                        <small
                            class="field-error"
                            id="passwordError">
                        </small>

                    </div>


                    <!-- General Message -->
                    <div
                        id="loginMessage"
                        class="message"
                        role="alert">
                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button">

                        <span id="buttonText">
                            Login
                        </span>

                    </button>

                </form>


                <!-- Demo Information -->
                <div class="login-info">

                    <div class="info-icon">
                        ✓
                    </div>

                    <div>
                        <strong>Secure Login</strong>

                        <p>
                            Your credentials are verified using the
                            StudentHub database.
                        </p>
                    </div>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer class="page-footer">
            <p>
                StudentHub • Full Stack Development
            </p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
