<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Smart Campus</title>

    <!-- Professional shared stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">
        <div class="container">

            <h1>Smart Campus</h1>

            <p>
                Event Management System
            </p>

        </div>
    </header>


    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <main>

        <div class="container">

            <div class="card login-card">

                <h2>Admin Login</h2>


                <!-- ================================
                     LOGIN ERROR
                ================================= -->

                <div
                    th:if="${param.error}"
                    class="error"
                    role="alert">

                    Invalid username or password.

                </div>


                <!-- ================================
                     LOGOUT MESSAGE
                ================================= -->

                <div
                    th:if="${param.logout}"
                    class="success"
                    role="alert">

                    You have been logged out successfully.

                </div>


                <!-- ================================
                     LOGIN FORM
                ================================= -->

                <form
                    th:action="@{/login}"
                    method="post">

                    <!-- Username -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                            autofocus>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="btn">

                        Sign In

                    </button>

                </form>


                <!-- ================================
                     ADMIN INFORMATION
                ================================= -->

                <div class="login-info">

                    <strong>
                        Administrator Access
                    </strong>

                    <p>
                        Sign in with your administrator
                        credentials to manage campus events.
                    </p>

                </div>

            </div>

        </div>

    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <p>
            Department of Computer Science and Engineering
            &nbsp;•&nbsp;
            Smart Campus
        </p>

    </footer>

</body>

</html>
